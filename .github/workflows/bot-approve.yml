---
# Approves a dependency-update pull request (Dependabot, Konflux) when no person needs to read it, as the OSAC CI app
# (osac-ci[bot]). The answer is "approve" only when every commit is the bot's own, plain and signed, and every changed file is a
# dependency file; a commit added by a person, a hand rebase, an "Update branch" merge, or a change to a workflow or a
# script makes it refuse, and then a person approves as for any pull request (see osac-project/osac-ci, README,
# "Approving dependency updates without a person"). The approval is made for the exact head commit that was checked, so a
# later push drops it (the repository dismisses stale approvals) and the next run looks again. A repeated run does not
# stack approvals.
#
# pull_request_target runs the workflow file from the default branch with the base repository's token (read-only here),
# and nothing here checks out or runs pull request code: the decision comes from the API. The approval itself uses the
# OSAC CI app's own token, minted from the app's key (an organization secret). For a pull request opened by Dependabot,
# GitHub gives the workflow the Dependabot secrets, not the Actions ones, so the key has to exist as an organization
# Dependabot secret too.
name: Bot approval
on:  # zizmor: ignore[dangerous-triggers] -- no pull request code is checked out or run
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number
        required: true

permissions:
  contents: read

# The newest push is the one that matters: an older run is cancelled.
concurrency:
  group: bot-approve-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

jobs:
  approve:
    # Only the two update bots; everything else would be answered "skip-not-a-bot" at the cost of a runner.
    if: >-
      github.repository == 'osac-project/osac' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(fromJSON('["dependabot[bot]","red-hat-konflux-kflux-prd-rh02[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the action is fetched from osac-ci by the runner; nothing of this repository is checked out
      pull-requests: read  # read the pull request, its commits, files and reviews; the approval uses the bot's credential
    steps:
      # The approval is made by the OSAC CI app (osac-ci[bot]), with a token that has the pull-request permission only and
      # lasts an hour. The app is the organization's; its key is an organization secret.
      - name: Token of the OSAC CI app, for the approval only
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: "4966101"
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - uses: osac-project/osac-ci/.github/actions/bot-approve@ddf100410769076e222341e317acc11eb3715f35  # osac-ci main
        id: approve
        with:
          github-token: ${{ github.token }}
          approve-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ github.event.pull_request.number || inputs.number }}
      - name: Keep the decision
        if: steps.approve.outputs.json-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bot-approval-${{ github.run_id }}
          path: ${{ steps.approve.outputs.json-file }}
          retention-days: 14
          if-no-files-found: ignore
