name: Helm Lint

on:
  pull_request:
    paths:
      - 'fulfillment-service/charts/**'
      - 'osac-operator/api/**'
      - 'osac-operator/charts/**'
      - 'osac-operator/config/crd/bases/**'
      - 'osac-operator/hack/sync-helm-crds.py'
      - 'osac-operator/Makefile'
      - '.github/workflows/helm-lint.yaml'

permissions:
  contents: read

jobs:
  # osac-operator-only: no other component currently generates Helm CRD
  # templates from a kubebuilder config/crd/bases/ source of truth, so
  # there's nothing to matrix this against yet.
  helm-crds-sync:
    name: Check Helm CRD sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Verify Helm CRD templates match bases
      working-directory: osac-operator
      run: make check-helm-crds

  helm-lint:
    name: Lint Helm chart (${{ matrix.component }}/${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: fulfillment-service
            chart: service
          - component: osac-operator
            chart: operator-crds
          - component: osac-operator
            chart: operator
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.0

    - name: Lint chart
      working-directory: ${{ matrix.component }}
      run: helm lint charts/${{ matrix.chart }}/

    - name: Template chart
      working-directory: ${{ matrix.component }}
      run: helm template test charts/${{ matrix.chart }}/ > /dev/null
