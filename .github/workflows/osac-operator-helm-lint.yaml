name: "osac-operator: Helm Lint"

on:
  pull_request:
    paths:
      - 'osac-operator/api/**'
      - 'osac-operator/charts/**'
      - 'osac-operator/config/crd/bases/**'
      - 'osac-operator/hack/sync-helm-crds.py'
      - 'osac-operator/Makefile'
      - '.github/workflows/osac-operator-helm-lint.yaml'

permissions:
  contents: read

jobs:
  helm-crds-sync:
    name: Check Helm CRD sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - name: Verify Helm CRD templates match bases
      working-directory: osac-operator
      run: make check-helm-crds

  helm-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.0

    - name: Lint operator-crds chart
      working-directory: osac-operator
      run: helm lint charts/operator-crds/

    - name: Lint operator chart
      working-directory: osac-operator
      run: helm lint charts/operator/

    - name: Template operator-crds chart
      working-directory: osac-operator
      run: helm template test charts/operator-crds/ > /dev/null

    - name: Template operator chart
      working-directory: osac-operator
      run: helm template test charts/operator/ > /dev/null
