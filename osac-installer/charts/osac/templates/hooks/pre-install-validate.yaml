{{- if .Values.validation.enabled }}
{{- $secretNames := list }}
{{- if .Values.aap.configAsCode.manifestSecret }}
{{- $secretNames = append $secretNames .Values.aap.configAsCode.manifestSecret }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "osac.fullname" . }}-pre-install-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "osac.fullname" . }}-validate
      containers:
      - name: validate
        # The fulfillment-service image bundles the osac CLI alongside the
        # server binary (see fulfillment-service/Containerfile), always
        # version-matched to this chart release -- so this hook runs the
        # exact same `osac install validate` a human runs locally, instead
        # of a second, hand-maintained implementation of the same checks in
        # shell.
        image: {{ .Values.service.images.service }}
        # OpenShift's restricted-v2 SCC runs this as an arbitrary UID with no
        # /etc/passwd entry, so $HOME is unset (or "/", not writable) -- and
        # the osac CLI always creates its config/cache directories under
        # $HOME on startup (see persistentPreRun in root_cmd.go), even for a
        # read-only command like `install validate`. Point it at a writable
        # scratch directory instead of relying on the pod's default HOME.
        env:
        - name: HOME
          value: /tmp
        command:
        - osac
        args:
        - install
        - validate
        - --services={{ include "osac.enabledServices" . }}
        {{- if .Values.bmf.metal3.enabled }}
        - --metal3
        {{- end }}
        {{- if .Values.aap.configAsCode.manifestSecret }}
        - --require-secret={{ .Release.Namespace }}/{{ .Values.aap.configAsCode.manifestSecret }}:license.zip
        {{- end }}
        # Deliberately NOT checking service.database.connection's secrets
        # (osac-db-config/osac-db-client-cert): those are created by this
        # same chart's own workload-db-secrets.yaml, a plain (non-hook)
        # resource -- and Helm always creates every pre-install hook (this
        # one included, at the earliest weight) before any plain resource.
        # Requiring them here is structurally unsatisfiable, in every
        # environment, regardless of bundled vs. external Postgres: they
        # can never exist yet at this point in the install. The AAP license
        # secret above is different -- install-osac creates it via `oc
        # create secret` before `helm upgrade --install` even runs, so it
        # genuinely does pre-exist by the time this hook fires.
      backoffLimit: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
# Static and unconditional: every GVR any prerequisite check the osac
# binary knows about can read, regardless of which services/toggles this
# particular install enables. Adding a new Operator check to
# osac-installer/pkg/install/data/prerequisites.yaml therefore never
# requires a chart/RBAC change. All read-only, and none of these resource
# types carry secret material -- unlike Secrets (below), which get their
# own tightly-scoped Role instead of a blanket grant here.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["list"]
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions"]
  verbs: ["list"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions"]
  verbs: ["get"]
- apiGroups: ["metal3.io"]
  resources: ["provisionings"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "osac.fullname" . }}-validate-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
{{- if $secretNames }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osac.fullname" . }}-validate-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
# Unlike the ClusterRole above, this is deliberately narrow: get-only
# (never list, so the hook can't enumerate every Secret in the namespace)
# on exactly the Secret names this install's own values reference
# (aap.configAsCode.manifestSecret) -- computed from the same value Helm
# already renders the Job's --require-secret arg from, so this list can
# never drift from what's actually checked.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames:
  {{- range $secretNames }}
  - {{ . | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osac.fullname" . }}-validate-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "osac.fullname" . }}-validate-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "osac.fullname" . }}-validate
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
